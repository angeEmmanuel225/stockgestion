<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro - Rapports</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div style="padding: 2rem 1rem;">
                <h1 style="color: var(--primary); font-size: 1.5rem; margin: 0;">📦 StockPro</h1>
            </div>
            <nav>
                <a href="dashboard.html" class="nav-item" data-page="dashboard">
                    <span>📊</span> Tableau de bord
                </a>
                <a href="materials.html" class="nav-item" data-page="materials">
                    <span>📦</span> Matériaux
                </a>
                <a href="transactions.html" class="nav-item" data-page="transactions">
                    <span>📝</span> Mouvements
                </a>
                <a href="alerts.html" class="nav-item" data-page="alerts">
                    <span>⚠️</span> Alertes
                </a>
                <a href="reports.html" class="nav-item active" data-page="reports">
                    <span>📈</span> Rapports
                </a>
                <a href="settings.html" class="nav-item" data-page="settings">
                    <span>⚙️</span> Paramètres
                </a>
            </nav>
            <div style="margin-top: auto; padding: 1rem; border-top: 1px solid var(--border);">
                <button id="logoutBtn" style="width: 100%;" class="btn btn-secondary">Déconnexion</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1.5rem; background: var(--bg-light); border-bottom: 1px solid var(--border); margin-bottom: 2rem;">
                <h2>Rapports</h2>
                <div style="display: flex; gap: 1rem;">
                    <span id="currentTime" style="color: var(--text-muted);">--:--</span>
                    <button class="btn btn-primary" onclick="exportToCSV()">📥 Exporter</button>
                </div>
            </div>

            <!-- Filtres Période -->
            <div style="padding: 0 2rem; margin-bottom: 2rem;">
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 1rem;">
                    <select id="reportType" class="form-select">
                        <option value="movement">Mouvements</option>
                        <option value="stock">Stock</option>
                        <option value="category">Par Catégorie</option>
                    </select>
                    <input type="date" id="dateFrom" class="form-input">
                    <input type="date" id="dateTo" class="form-input">
                    <button class="btn btn-primary" onclick="generateReport()">🔍 Générer</button>
                </div>
            </div>

            <!-- Graphiques -->
            <div style="padding: 0 2rem;">
                <div class="card" style="margin-bottom: 2rem;">
                    <h3>Mouvements 30 Jours</h3>
                    <canvas id="reportChart" style="max-height: 300px;"></canvas>
                </div>

                <div class="card">
                    <h3>Détails</h3>
                    <div style="overflow-x: auto;">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Période</th>
                                    <th>Entrées</th>
                                    <th>Sorties</th>
                                    <th>Solde</th>
                                    <th>Valeur</th>
                                </tr>
                            </thead>
                            <tbody id="reportTable">
                                <tr><td colspan="5" class="text-center">Chargement...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script src="reports.js"></script>
</body>
</html>
