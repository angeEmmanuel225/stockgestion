<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro - Paramètres</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div style="padding: 2rem 1rem;">
                <h1 style="color: var(--primary); font-size: 1.5rem; margin: 0;">📦 StockPro</h1>
            </div>
            <nav>
                <a href="dashboard.html" class="nav-item" data-page="dashboard">
                    <span>📊</span> Tableau de bord
                </a>
                <a href="materials.html" class="nav-item" data-page="materials">
                    <span>📦</span> Matériaux
                </a>
                <a href="transactions.html" class="nav-item" data-page="transactions">
                    <span>📝</span> Mouvements
                </a>
                <a href="alerts.html" class="nav-item" data-page="alerts">
                    <span>⚠️</span> Alertes
                </a>
                <a href="reports.html" class="nav-item" data-page="reports">
                    <span>📈</span> Rapports
                </a>
                <a href="settings.html" class="nav-item active" data-page="settings">
                    <span>⚙️</span> Paramètres
                </a>
            </nav>
            <div style="margin-top: auto; padding: 1rem; border-top: 1px solid var(--border);">
                <button id="logoutBtn" style="width: 100%;" class="btn btn-secondary">Déconnexion</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1.5rem; background: var(--bg-light); border-bottom: 1px solid var(--border); margin-bottom: 2rem;">
                <h2>Paramètres</h2>
                <span id="currentTime" style="color: var(--text-muted);">--:--</span>
            </div>

            <div style="padding: 0 2rem;">
                <!-- Profil Utilisateur -->
                <div class="card" style="margin-bottom: 2rem;">
                    <h3>👤 Mon Profil</h3>
                    <div id="userInfo" style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                        <div>
                            <label>Prénom</label>
                            <div style="padding: 0.75rem; background: var(--bg-light); border-radius: 4px;" id="firstName">-</div>
                        </div>
                        <div>
                            <label>Nom</label>
                            <div style="padding: 0.75rem; background: var(--bg-light); border-radius: 4px;" id="lastName">-</div>
                        </div>
                        <div>
                            <label>Email</label>
                            <div style="padding: 0.75rem; background: var(--bg-light); border-radius: 4px;" id="userEmail">-</div>
                        </div>
                        <div>
                            <label>Rôle</label>
                            <div style="padding: 0.75rem; background: var(--bg-light); border-radius: 4px;" id="userRole">-</div>
                        </div>
                    </div>
                </div>

                <!-- Catégories -->
                <div class="card" style="margin-bottom: 2rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h3>📂 Catégories</h3>
                        <button class="btn btn-primary" id="btnAddCategory">Ajouter</button>
                    </div>
                    <div id="categoriesContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem;"></div>
                </div>

                <!-- Unités -->
                <div class="card" style="margin-bottom: 2rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h3>📏 Unités</h3>
                        <button class="btn btn-primary" id="btnAddUnit">Ajouter</button>
                    </div>
                    <div id="unitsContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem;"></div>
                </div>

                <!-- Sécurité -->
                <div class="card">
                    <h3>🔐 Sécurité</h3>
                    <button class="btn btn-secondary" id="btnChangePassword" style="width: 100%;">Changer le mot de passe</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Catégorie -->
    <div id="modalCategory" class="modal" style="display: none;">
        <div class="modal-content" style="width: 90%; max-width: 400px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3>Nouvelle Catégorie</h3>
                <button class="btn-close" onclick="closeModal('modalCategory')">×</button>
            </div>
            <form id="formCategory">
                <div style="margin-bottom: 1rem;">
                    <label>Nom</label>
                    <input type="text" name="name" class="form-input" required>
                </div>
                <div style="margin-bottom: 1rem;">
                    <label>Description</label>
                    <textarea name="description" class="form-textarea" rows="3"></textarea>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Créer</button>
                    <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeModal('modalCategory')">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Unité -->
    <div id="modalUnit" class="modal" style="display: none;">
        <div class="modal-content" style="width: 90%; max-width: 400px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3>Nouvelle Unité</h3>
                <button class="btn-close" onclick="closeModal('modalUnit')">×</button>
            </div>
            <form id="formUnit">
                <div style="margin-bottom: 1rem;">
                    <label>Nom</label>
                    <input type="text" name="name" class="form-input" placeholder="Kilogramme" required>
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label>Abréviation</label>
                    <input type="text" name="abbreviation" class="form-input" placeholder="kg" maxlength="5" required>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Créer</button>
                    <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeModal('modalUnit')">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="settings.js"></script>
</body>
</html>
