<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord - StockPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">📦 StockPro</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">v2.0</div>
            </div>

            <div class="nav-section">
                <div class="nav-title">Principal</div>
                <div class="nav-item active" data-page="dashboard">📊 Tableau de Bord</div>
            </div>

            <div class="nav-section">
                <div class="nav-title">Gestion</div>
                <div class="nav-item" data-page="materials">📦 Matériaux</div>
                <div class="nav-item" data-page="transactions">📤 Transactions</div>
            </div>

            <div class="nav-section">
                <div class="nav-title">Rapports</div>
                <div class="nav-item" data-page="reports">📈 Rapports</div>
                <div class="nav-item" data-page="alerts">⚠️ Alertes</div>
            </div>

            <div class="user-info">
                <div class="user-name">-</div>
                <div class="user-role">-</div>
                <button class="btn btn-danger logout-btn" style="width: 100%; margin-top: 1rem;">Déconnexion</button>
            </div>
        </nav>

        <!-- Contenu -->
        <div class="main-content">
            <div class="topbar">
                <div class="page-title">📊 Tableau de Bord</div>
                <div id="currentTime" class="text-muted"></div>
            </div>

            <div class="page-content">
                <!-- KPIs -->
                <div class="kpi-grid" id="kpiContainer">
                    <div style="text-align: center; padding: 2rem;">Chargement...</div>
                </div>

                <!-- Graphiques -->
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">
                    <div class="card">
                        <h3>Mouvements (14 jours)</h3>
                        <canvas id="movementsChart" height="300"></canvas>
                    </div>
                    <div class="card">
                        <h3>Distribution Catégories</h3>
                        <canvas id="categoryChart" height="300"></canvas>
                    </div>
                </div>

                <!-- Stock -->
                <div class="card">
                    <h3>Niveaux de Stock</h3>
                    <div id="stockLevels"></div>
                </div>

                <!-- Alertes -->
                <div class="card">
                    <h3>⚠️ Alertes Récentes</h3>
                    <div id="alertsPanel"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
