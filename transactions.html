<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro - Mouvements</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div style="padding: 2rem 1rem;">
                <h1 style="color: var(--primary); font-size: 1.5rem; margin: 0;">📦 StockPro</h1>
            </div>
            <nav>
                <a href="dashboard.html" class="nav-item" data-page="dashboard">
                    <span>📊</span> Tableau de bord
                </a>
                <a href="materials.html" class="nav-item" data-page="materials">
                    <span>📦</span> Matériaux
                </a>
                <a href="transactions.html" class="nav-item active" data-page="transactions">
                    <span>📝</span> Mouvements
                </a>
                <a href="alerts.html" class="nav-item" data-page="alerts">
                    <span>⚠️</span> Alertes
                </a>
                <a href="reports.html" class="nav-item" data-page="reports">
                    <span>📈</span> Rapports
                </a>
                <a href="settings.html" class="nav-item" data-page="settings">
                    <span>⚙️</span> Paramètres
                </a>
            </nav>
            <div style="margin-top: auto; padding: 1rem; border-top: 1px solid var(--border);">
                <button id="logoutBtn" style="width: 100%;" class="btn btn-secondary">Déconnexion</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1.5rem; background: var(--bg-light); border-bottom: 1px solid var(--border); margin-bottom: 2rem;">
                <h2>Mouvements de Stock</h2>
                <div style="display: flex; gap: 1rem;">
                    <span id="currentTime" style="color: var(--text-muted);">--:--</span>
                    <button id="btnAddMovement" class="btn btn-primary">➕ Nouveau</button>
                </div>
            </div>

            <!-- Filtres -->
            <div style="padding: 0 2rem; margin-bottom: 2rem;">
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                    <input type="text" id="searchInput" placeholder="Rechercher..." class="form-input">
                    <select id="typeFilter" class="form-select">
                        <option value="">Tous les types</option>
                        <option value="entry">Entrée</option>
                        <option value="exit">Sortie</option>
                        <option value="adjustment">Ajustement</option>
                    </select>
                    <input type="date" id="dateFilter" class="form-input">
                </div>
            </div>

            <!-- Table -->
            <div style="padding: 0 2rem;">
                <div class="card" style="overflow-x: auto;">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Matériau</th>
                                <th>Type</th>
                                <th>Quantité</th>
                                <th>Référence</th>
                                <th>Utilisateur</th>
                                <th>Notes</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="transactionsTable">
                            <tr><td colspan="8" class="text-center" style="padding: 2rem;">Chargement...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Nouveau Mouvement -->
    <div id="modalAdd" class="modal" style="display: none;">
        <div class="modal-content" style="width: 90%; max-width: 500px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3>Nouveau Mouvement</h3>
                <button class="btn-close" onclick="closeModal('modalAdd')">×</button>
            </div>
            <form id="formAdd">
                <div style="margin-bottom: 1rem;">
                    <label>Matériau</label>
                    <select name="material_id" class="form-select" id="materialSelect" required></select>
                </div>
                <div style="margin-bottom: 1rem;">
                    <label>Type</label>
                    <select name="type" class="form-select" required>
                        <option value="">Sélectionner...</option>
                        <option value="entry">Entrée</option>
                        <option value="exit">Sortie</option>
                        <option value="adjustment">Ajustement</option>
                    </select>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                    <div>
                        <label>Quantité</label>
                        <input type="number" name="quantity" class="form-input" value="1" min="0" required>
                    </div>
                    <div>
                        <label>Référence</label>
                        <input type="text" name="reference_no" class="form-input" placeholder="BL-001">
                    </div>
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label>Notes</label>
                    <textarea name="notes" class="form-textarea" rows="3"></textarea>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Créer</button>
                    <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeModal('modalAdd')">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="transactions.js"></script>
</body>
</html>
