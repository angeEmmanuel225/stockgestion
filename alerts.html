<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro - Alertes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div style="padding: 2rem 1rem;">
                <h1 style="color: var(--primary); font-size: 1.5rem; margin: 0;">📦 StockPro</h1>
            </div>
            <nav>
                <a href="dashboard.html" class="nav-item" data-page="dashboard">
                    <span>📊</span> Tableau de bord
                </a>
                <a href="materials.html" class="nav-item" data-page="materials">
                    <span>📦</span> Matériaux
                </a>
                <a href="transactions.html" class="nav-item" data-page="transactions">
                    <span>📝</span> Mouvements
                </a>
                <a href="alerts.html" class="nav-item active" data-page="alerts">
                    <span>⚠️</span> Alertes
                </a>
                <a href="reports.html" class="nav-item" data-page="reports">
                    <span>📈</span> Rapports
                </a>
                <a href="settings.html" class="nav-item" data-page="settings">
                    <span>⚙️</span> Paramètres
                </a>
            </nav>
            <div style="margin-top: auto; padding: 1rem; border-top: 1px solid var(--border);">
                <button id="logoutBtn" style="width: 100%;" class="btn btn-secondary">Déconnexion</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1.5rem; background: var(--bg-light); border-bottom: 1px solid var(--border); margin-bottom: 2rem;">
                <h2>Alertes Stock</h2>
                <span id="currentTime" style="color: var(--text-muted);">--:--</span>
            </div>

            <!-- Stats Cartes -->
            <div style="padding: 0 2rem; margin-bottom: 2rem; display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                <div class="kpi-card">
                    <div class="kpi-label" style="color: #ef4444;">🔴 Critique</div>
                    <div class="kpi-value" id="criticalCount">0</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label" style="color: #f59e0b;">🟡 Avertissement</div>
                    <div class="kpi-value" id="warningCount">0</div>
                </div>
            </div>

            <!-- Filtres -->
            <div style="padding: 0 2rem; margin-bottom: 2rem;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <select id="severityFilter" class="form-select">
                        <option value="">Toutes les alertes</option>
                        <option value="critical">Critique uniquement</option>
                        <option value="warning">Avertissement uniquement</option>
                    </select>
                    <select id="statusFilter" class="form-select">
                        <option value="">Tous les statuts</option>
                        <option value="0">Non lues</option>
                        <option value="1">Lues</option>
                    </select>
                </div>
            </div>

            <!-- Alertes -->
            <div style="padding: 0 2rem;" id="alertsContainer">
                <div class="card" style="text-align: center; padding: 2rem;">
                    Chargement...
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script src="alerts.js"></script>
</body>
</html>
