<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - StockPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #060b14 0%, #0c1220 100%);
        }
        .login-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2.5rem;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
        }
        .login-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .demo-info {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 6px;
            padding: 1rem;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .demo-info strong {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }
        .demo-account {
            margin-bottom: 0.5rem;
        }
        .demo-account code {
            background: var(--bg-main);
            padding: 0.25rem 0.5rem;
            border-radius: 3px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="login-screen">
        <div class="login-box">
            <div class="login-header">
                <div class="login-logo">📦</div>
                <div class="login-title">StockPro</div>
                <div class="login-subtitle">Gestion de Stock v2.0</div>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Identifiant</label>
                    <input type="text" name="user_id" class="form-input" placeholder="Ex: DIR001" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" name="password" class="form-input" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Se connecter
                </button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userIdInput = document.querySelector('[name="user_id"]');
            const passwordInput = document.querySelector('[name="password"]');
            const user_id = userIdInput.value.trim();
            const password = passwordInput.value;
            
            // Validation
            if (!user_id) {
                showError('Veuillez entrer votre identifiant');
                return;
            }
            
            if (!password) {
                showError('Veuillez entrer votre mot de passe');
                return;
            }
            
            // Désactiver le bouton pendant la requête
            const submitBtn = document.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Connexion en cours...';
            
            try {
                const response = await apiCall('login.php', 'POST', {
                    user_id: user_id,
                    password: password
                });
                
                if (response && response.success) {
                    showSuccess('✅ Connexion réussie!');
                    setTimeout(() => {
                        // Rediriger vers le tableau de bord
                        window.location.href       = '../dashboard.html';
                    }, 1000);
                } else {
                    showError(response?.error || 'Erreur de connexion');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Se connecter';
                    passwordInput.value = '';
                }
            } catch (error) {
                showError('Erreur de connexion: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Se connecter';
            }
        });
        
        // Permettre la connexion avec Entrée
        document.addEventListener('DOMContentLoaded', () => {
            const userIdInput = document.querySelector('[name="user_id"]');
            const passwordInput = document.querySelector('[name="password"]');
            
            if (userIdInput) {
                userIdInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        passwordInput?.focus();
                    }
                });
            }
            
            if (passwordInput) {
                passwordInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
                    }
                });
            }
        });
    </script>
</body>
</html>
