<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro - Détail Matériau</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div style="padding: 2rem 1rem;">
                <h1 style="color: var(--primary); font-size: 1.5rem; margin: 0;">📦 StockPro</h1>
            </div>
            <nav>
                <a href="dashboard.html" class="nav-item" data-page="dashboard">
                    <span>📊</span> Tableau de bord
                </a>
                <a href="materials.html" class="nav-item active" data-page="materials">
                    <span>📦</span> Matériaux
                </a>
                <a href="transactions.html" class="nav-item" data-page="transactions">
                    <span>📝</span> Mouvements
                </a>
                <a href="alerts.html" class="nav-item" data-page="alerts">
                    <span>⚠️</span> Alertes
                </a>
                <a href="reports.html" class="nav-item" data-page="reports">
                    <span>📈</span> Rapports
                </a>
                <a href="settings.html" class="nav-item" data-page="settings">
                    <span>⚙️</span> Paramètres
                </a>
            </nav>
            <div style="margin-top: auto; padding: 1rem; border-top: 1px solid var(--border);">
                <button id="logoutBtn" style="width: 100%;" class="btn btn-secondary">Déconnexion</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1.5rem; background: var(--bg-light); border-bottom: 1px solid var(--border); margin-bottom: 2rem;">
                <div>
                    <a href="materials.html" style="color: var(--primary); text-decoration: none;">← Matériaux</a>
                    <h2 id="materialName" style="margin: 0.5rem 0 0 0;">-</h2>
                </div>
                <span id="currentTime" style="color: var(--text-muted);">--:--</span>
            </div>

            <div style="padding: 0 2rem;">
                <!-- Infos Matériau -->
                <div class="card" style="margin-bottom: 2rem;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2rem; margin-bottom: 2rem;">
                        <div>
                            <label style="color: var(--text-muted); font-size: 0.9rem;">Code</label>
                            <div style="font-size: 1.3rem; font-weight: 600;" id="matCode">-</div>
                        </div>
                        <div>
                            <label style="color: var(--text-muted); font-size: 0.9rem;">Catégorie</label>
                            <div style="font-size: 1.3rem; font-weight: 600;" id="matCategory">-</div>
                        </div>
                        <div>
                            <label style="color: var(--text-muted); font-size: 0.9rem;">Unité</label>
                            <div style="font-size: 1.3rem; font-weight: 600;" id="matUnit">-</div>
                        </div>
                    </div>
                </div>

                <!-- Stock -->
                <div class="card" style="margin-bottom: 2rem;">
                    <h3>📦 Stock Actuel</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2rem;">
                        <div>
                            <label style="color: var(--text-muted); font-size: 0.9rem;">Stock</label>
                            <div style="font-size: 2rem; font-weight: 700; color: var(--primary);" id="matStock">0</div>
                        </div>
                        <div>
                            <label style="color: var(--text-muted); font-size: 0.9rem;">Minimum</label>
                            <div style="font-size: 1.3rem; font-weight: 600;" id="matMin">0</div>
                        </div>
                        <div>
                            <label style="color: var(--text-muted); font-size: 0.9rem;">Maximum</label>
                            <div style="font-size: 1.3rem; font-weight: 600;" id="matMax">0</div>
                        </div>
                    </div>
                    <div style="margin-top: 1.5rem;">
                        <div style="width: 100%; height: 10px; background: var(--border); border-radius: 5px; overflow: hidden;">
                            <div id="matProgressBar" style="height: 100%; width: 50%; background: var(--primary); transition: 0.3s;"></div>
                        </div>
                        <div style="margin-top: 0.5rem; font-size: 0.9rem; color: var(--text-muted);" id="matProgressText">-</div>
                    </div>
                </div>

                <!-- Historique -->
                <div class="card">
                    <h3>📊 Historique 30 Jours</h3>
                    <canvas id="historyChart" style="max-height: 300px; margin-bottom: 2rem;"></canvas>
                    
                    <h3 style="margin-top: 2rem;">📝 Mouvements Récents</h3>
                    <div style="overflow-x: auto;">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Type</th>
                                    <th>Quantité</th>
                                    <th>Référence</th>
                                    <th>Utilisateur</th>
                                </tr>
                            </thead>
                            <tbody id="transactionsTable">
                                <tr><td colspan="5" class="text-center">Chargement...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script src="mat-detail.js"></script>
</body>
</html>
